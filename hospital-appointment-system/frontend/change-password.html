<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - Hospital Appointment System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="brand">🏥 Hospital App</a>
        <ul class="nav-links" id="navLinks">
            <li><a href="index.html">Home</a></li>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="doctors.html">Doctors</a></li>
            <li><a href="appointments.html">My Appointments</a></li>
            <li><a href="change-password.html" class="active">Change Password</a></li>
            <li><a href="#" onclick="logout()">Logout</a></li>
        </ul>
    </nav>

    <div class="auth-container">
        <div class="card">
            <h2>🔐 Change Password</h2>
            <p style="color: #666; margin-bottom: 1.5rem;">Enter your current password and choose a new one.</p>

            <div id="message" class="alert" style="display: none;"></div>

            <form id="changePasswordForm" onsubmit="handleChangePassword(event)">
                <div class="form-group">
                    <label for="currentPassword">Current Password</label>
                    <input type="password" id="currentPassword" placeholder="Enter your current password" required>
                </div>

                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" placeholder="Enter new password (min 6 characters)" required minlength="6">
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm New Password</label>
                    <input type="password" id="confirmPassword" placeholder="Confirm new password" required minlength="6">
                </div>

                <button type="submit" class="btn btn-success btn-block" id="submitBtn">Change Password</button>
            </form>

            <div class="auth-footer" style="margin-top: 1.5rem;">
                <a href="dashboard.html">← Back to Dashboard</a>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        const API_URL = 'http://localhost:5000/api';

        // ============================================
        // GET AUTH HEADERS
        // ============================================
        function getAuthHeaders() {
            const token = localStorage.getItem('token');
            return {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            };
        }

        // ============================================
        // HANDLE CHANGE PASSWORD
        // ============================================
        async function handleChangePassword(event) {
            event.preventDefault();

            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Validate passwords match
            if (newPassword !== confirmPassword) {
                showMessage('❌ New passwords do not match!', 'error');
                return;
            }

            if (newPassword.length < 6) {
                showMessage('❌ New password must be at least 6 characters long', 'error');
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Changing...';

            try {
                const token = localStorage.getItem('token');
                if (!token) {
                    showMessage('❌ Please login first', 'error');
                    window.location.href = 'login.html';
                    return;
                }

                const response = await fetch(`${API_URL}/auth/change-password`, {
                    method: 'POST',
                    headers: getAuthHeaders(),
                    body: JSON.stringify({ currentPassword, newPassword })
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage('✅ ' + data.message, 'success');
                    document.getElementById('changePasswordForm').reset();
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 2000);
                } else {
                    showMessage('❌ ' + (data.error || 'Something went wrong'), 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showMessage('❌ Network error. Please try again.', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Change Password';
            }
        }

        function showMessage(message, type) {
            const msgEl = document.getElementById('message');
            msgEl.textContent = message;
            msgEl.className = `alert alert-${type}`;
            msgEl.style.display = 'block';
            
            setTimeout(() => {
                msgEl.style.display = 'none';
            }, 8000);
        }

        // ============================================
        // PAGE LOAD - CHECK AUTH
        // ============================================
        document.addEventListener('DOMContentLoaded', async function() {
            const token = localStorage.getItem('token');
            const user = getCurrentUser();

            if (!token || !user) {
                window.location.href = 'login.html';
                return;
            }

            console.log('📄 Change Password page loaded for:', user.fullname);
        });
    </script>
</body>
</html>
