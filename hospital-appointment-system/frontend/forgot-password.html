<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Hospital Appointment System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="brand">🏥 Hospital App</a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="login.html">Login</a></li>
            <li><a href="register.html">Register</a></li>
        </ul>
    </nav>

    <div class="auth-container">
        <div class="card">
            <h2>🔑 Forgot Password</h2>
            <p style="color: #666; margin-bottom: 1.5rem;">Enter your email address to receive a password reset token.</p>

            <div id="message" class="alert" style="display: none;"></div>

            <form id="forgotForm" onsubmit="handleForgotPassword(event)">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>

                <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Send Reset Link</button>
            </form>

            <div style="text-align: center; margin-top: 1.5rem;">
                <a href="login.html" class="btn btn-secondary">← Back to Login</a>
            </div>

            <!-- Reset Token Display -->
            <div id="resetTokenDisplay" style="display: none; margin-top: 1.5rem; padding: 1rem; background: #f0f8ff; border-radius: 4px; border-left: 4px solid #3498db;">
                <p style="font-weight: bold; margin-bottom: 0.5rem;">📋 Your Reset Token:</p>
                <code id="resetTokenValue" style="word-break: break-all; font-size: 0.85rem; background: #e8f0fe; padding: 0.5rem; display: block; border-radius: 4px;"></code>
                
                <!-- CLEAR BUTTON TO RESET PASSWORD PAGE -->
                <div style="margin-top: 1rem; text-align: center;">
                    <p style="color: #666; font-size: 0.9rem; margin-bottom: 0.5rem;">
                        Copy the token above, then click the button below:
                    </p>
                    <a href="reset-password.html" class="btn btn-success" style="display: inline-block;">
                        🔐 Go to Reset Password Page
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';

        async function handleForgotPassword(event) {
            event.preventDefault();
            console.log('📝 Forgot password form submitted');

            const email = document.getElementById('email').value;
            const submitBtn = document.getElementById('submitBtn');

            submitBtn.disabled = true;
            submitBtn.textContent = 'Sending...';

            try {
                console.log('📡 Sending request to:', `${API_URL}/auth/forgot-password`);
                const response = await fetch(`${API_URL}/auth/forgot-password`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email })
                });

                console.log('📥 Response status:', response.status);
                const data = await response.json();
                console.log('📦 Response data:', data);

                if (response.ok) {
                    showMessage('✅ ' + data.message, 'success');
                    
                    // Show reset token
                    if (data.resetToken) {
                        document.getElementById('resetTokenValue').textContent = data.resetToken;
                        document.getElementById('resetTokenDisplay').style.display = 'block';
                        // Scroll to token
                        document.getElementById('resetTokenDisplay').scrollIntoView({ behavior: 'smooth' });
                    }
                    
                    document.getElementById('forgotForm').reset();
                } else {
                    showMessage('❌ ' + (data.error || 'Something went wrong'), 'error');
                }
            } catch (error) {
                console.error('❌ Error:', error);
                showMessage('❌ Network error. Please try again.', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Send Reset Link';
            }
        }

        function showMessage(message, type) {
            const msgEl = document.getElementById('message');
            msgEl.textContent = message;
            msgEl.className = `alert alert-${type}`;
            msgEl.style.display = 'block';
            
            setTimeout(() => {
                msgEl.style.display = 'none';
            }, 10000);
        }

        console.log('✅ forgot-password.html loaded');
    </script>
</body>
</html>
